name: Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK from GitHub runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline English speech model (Apache 2.0)
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            --output /tmp/vosk-model.zip
          mkdir -p app/src/main/assets
          unzip -q /tmp/vosk-model.zip -d app/src/main/assets
          test -d app/src/main/assets/vosk-model-small-en-us-0.15/am
      - name: Generate reproducible spoken examples
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          python3 scripts/make_examples.py
      - name: Exercise Vosk on actual audio and print recognized words
        run: |
          python3 -m pip install --quiet vosk==0.3.45
          python3 scripts/check_asr_examples.py
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: audio-bleeper-v0.2-examples-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
